spring.application.name=FlashKartApi

spring.datasource.url=jdbc:mysql://localhost:3306/flashkart
spring.datasource.username=root
spring.datasource.password=Adityan2001
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator ? expose all endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# App info shown in /actuator/info
info.app.name=Flashkart API
info.app.version=1.0.0
info.app.env=local

# Scheduler
spring.task.scheduling.pool.size=5

management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,DELETE
